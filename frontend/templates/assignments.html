{% extends "base.html" %}

{% block content %}
<div class="max-w-6xl mx-auto mt-8">
    <div class="bg-white border-4 border-black shadow-neo-lg p-8 relative mb-8">
        <h1 class="text-4xl font-black uppercase tracking-tighter bg-neo-pink text-white inline-block px-4 py-2 border-4 border-black -rotate-2 shadow-neo-sm">
            Assignments
        </h1>
    </div>

    <div class="grid gap-6" id="assignments-list">
        <!-- This will be dynamically populated -->
        <div class="bg-white border-4 border-black p-6 flex justify-between items-center shadow-neo-md hover:-translate-y-1 hover:shadow-neo-lg transition-all">
            <div>
                <h3 class="text-2xl font-black uppercase">Sample Quiz</h3>
                <p class="font-bold text-gray-600 mt-2">Due: Oct 31, 2026</p>
            </div>
            <button class="bg-neo-yellow font-black border-4 border-black px-6 py-3 shadow-neo-sm hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-none transition-all uppercase">
                Start Quiz
            </button>
        </div>
    </div>
</div>
{% endblock %}
