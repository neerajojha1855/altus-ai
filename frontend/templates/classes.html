{% extends "base.html" %}

{% block content %}
<div class="max-w-6xl mx-auto mt-8">
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-4xl font-black uppercase tracking-tighter bg-neo-cyan inline-block px-4 py-2 border-4 border-black rotate-1 shadow-neo-sm">
            Classes
        </h1>
        <button id="create-class-btn" class="bg-neo-pink text-white font-black uppercase border-4 border-black shadow-neo-md px-6 py-3 text-lg hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-neo-sm transition-all">
            + New Class
        </button>
    </div>

    <!-- Create Class Modal (Hidden by default) -->
    <div id="class-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white border-4 border-black shadow-neo-lg p-8 max-w-md w-full relative">
            <button id="close-modal-btn" class="absolute top-2 right-2 text-2xl font-black hover:text-neo-pink">&times;</button>
            <h2 class="text-2xl font-black uppercase mb-6">Create New Class</h2>
            <form id="create-class-form" class="space-y-4">
                <div>
                    <label class="block font-bold mb-2 uppercase text-sm" for="class-name">Class Name</label>
                    <input type="text" id="class-name" class="w-full border-4 border-black p-3 font-medium focus:outline-none focus:ring-4 focus:ring-neo-yellow" required>
                </div>
                <div>
                    <label class="block font-bold mb-2 uppercase text-sm" for="class-subject">Subject</label>
                    <input type="text" id="class-subject" class="w-full border-4 border-black p-3 font-medium focus:outline-none focus:ring-4 focus:ring-neo-yellow" required>
                </div>
                <button type="submit" class="w-full bg-neo-cyan font-black border-4 border-black py-3 uppercase shadow-neo-sm hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-none transition-all mt-4">Create</button>
            </form>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="classes-list">
        <!-- Classes will be loaded here -->
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const modal = document.getElementById('class-modal');
        const openBtn = document.getElementById('create-class-btn');
        const closeBtn = document.getElementById('close-modal-btn');
        const form = document.getElementById('create-class-form');

        openBtn.addEventListener('click', () => modal.classList.remove('hidden'));
        closeBtn.addEventListener('click', () => modal.classList.add('hidden'));

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('class-name').value;
            const subject = document.getElementById('class-subject').value;
            const token = localStorage.getItem('firebaseToken');

            const response = await fetch('/api/classes', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ name, subject })
            });

            if (response.ok) {
                alert('Class created successfully!');
                modal.classList.add('hidden');
                form.reset();
                // Optionally reload classes
            } else {
                alert('Failed to create class.');
            }
        });
    });
</script>
{% endblock %}
