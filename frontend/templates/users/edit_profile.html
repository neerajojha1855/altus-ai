{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto mt-8">
    <div class="flex items-center space-x-4 mb-8">
        <div class="w-4 h-12 bg-neo-green border-4 border-black"></div>
        <h1 class="text-5xl font-black uppercase tracking-tighter">Edit Profile</h1>
    </div>
    
    <div class="bg-white border-4 border-black shadow-neo-lg p-6 sm:p-10">
        <form action="{{ url_for('views.edit_profile') }}" method="POST" class="space-y-8">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block font-bold mb-2 uppercase text-sm tracking-widest" for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name" value="{{ current_user.first_name if current_user else '' }}" class="w-full border-4 border-black p-4 font-bold text-lg focus:outline-none focus:ring-4 focus:ring-neo-cyan bg-white transition-shadow" placeholder="Jane" required>
                </div>
                <div>
                    <label class="block font-bold mb-2 uppercase text-sm tracking-widest" for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" value="{{ current_user.last_name if current_user else '' }}" class="w-full border-4 border-black p-4 font-bold text-lg focus:outline-none focus:ring-4 focus:ring-neo-cyan bg-white transition-shadow" placeholder="Doe" required>
                </div>
            </div>
            
            <div class="relative">
                <label class="block font-bold mb-2 uppercase text-sm tracking-widest" for="email">Email Address</label>
                <input type="email" id="email" name="email" value="{{ current_user.email if current_user else '' }}" class="w-full border-4 border-black p-4 font-bold text-lg focus:outline-none bg-gray-200 text-gray-500 cursor-not-allowed" disabled>
                <!-- Tooltip styling -->
                <div class="absolute right-4 top-12 bg-neo-pink text-white font-bold border-4 border-black px-2 py-1 text-xs uppercase shadow-neo-sm transform rotate-3 pointer-events-none">
                    Unchangeable
                </div>
            </div>
            
            <div class="pt-8 border-t-4 border-black border-dashed mt-8">
                <h2 class="text-3xl font-black mb-6 uppercase tracking-tight">Preferences</h2>
                
                <label class="flex items-center space-x-4 cursor-pointer group bg-neo-cyan p-4 border-4 border-black shadow-neo-sm hover:shadow-none hover:translate-x-[4px] hover:translate-y-[4px] transition-all">
                    <input type="checkbox" name="email_notifications" class="w-8 h-8 border-4 border-black checked:bg-black accent-black appearance-none bg-white relative cursor-pointer" checked>
                    <span class="font-bold text-lg uppercase tracking-wider group-hover:underline decoration-4">Receive email alerts</span>
                </label>
            </div>
            
            <div class="flex flex-col sm:flex-row gap-6 pt-8">
                <button type="submit" class="flex-1 bg-neo-yellow text-black font-black border-4 border-black shadow-neo-md py-4 text-xl uppercase tracking-widest hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-neo-sm active:translate-x-[6px] active:translate-y-[6px] active:shadow-none transition-all">
                    Save Changes
                </button>
                <button type="button" class="flex-1 bg-neo-pink text-white font-black border-4 border-black shadow-neo-md py-4 text-xl uppercase tracking-widest hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-neo-sm active:translate-x-[6px] active:translate-y-[6px] active:shadow-none transition-all">
                    Delete Account
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
