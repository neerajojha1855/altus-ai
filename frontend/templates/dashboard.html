{% extends "base.html" %}

{% block content %}
<div class="max-w-6xl mx-auto mt-8">
    <div class="bg-white border-4 border-black shadow-neo-lg p-8 relative mb-8">
        <h1 class="text-4xl font-black uppercase tracking-tighter bg-neo-yellow inline-block px-4 py-2 border-4 border-black -rotate-1 shadow-neo-sm" id="welcome-message">
            Welcome!
        </h1>
        <p class="text-xl mt-4 font-bold" id="role-display"></p>
    </div>

    <!-- Student Dashboard -->
    <div id="student-dashboard" class="hidden space-y-8">
        <h2 class="text-3xl font-black uppercase border-b-4 border-black pb-2 inline-block">My Assignments</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="student-assignments">
            <!-- Populated via JS -->
        </div>
    </div>

    <!-- Teacher Dashboard -->
    <div id="teacher-dashboard" class="hidden space-y-8">
        <div class="flex justify-between items-center border-b-4 border-black pb-2">
            <h2 class="text-3xl font-black uppercase">My Classes</h2>
            <a href="{{ url_for('views.classes') }}" class="bg-neo-cyan font-black uppercase border-4 border-black shadow-neo-sm px-4 py-2 hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-none transition-all">Manage Classes</a>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="teacher-classes">
            <!-- Populated via JS -->
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-dashboard" class="hidden space-y-8">
        <h2 class="text-3xl font-black uppercase border-b-4 border-black pb-2">System Overview</h2>
        <div class="p-8 border-4 border-black bg-neo-pink text-white font-bold text-center">
            Admin features coming soon.
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('firebaseToken');
        if (!token) {
            window.location.href = "{{ url_for('views.login') }}";
            return;
        }

        try {
            const response = await fetch('/api/users/me', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok) {
                const user = await response.json();
                document.getElementById('welcome-message').innerText = `Welcome, ${user.name || user.email}!`;
                document.getElementById('role-display').innerText = `Role: ${user.role.toUpperCase()}`;

                if (user.role === 'student') {
                    document.getElementById('student-dashboard').classList.remove('hidden');
                } else if (user.role === 'teacher') {
                    document.getElementById('teacher-dashboard').classList.remove('hidden');
                } else if (user.role === 'administrator') {
                    document.getElementById('admin-dashboard').classList.remove('hidden');
                }
            } else {
                window.location.href = "{{ url_for('views.login') }}";
            }
        } catch (error) {
            console.error(error);
        }
    });
</script>
{% endblock %}
